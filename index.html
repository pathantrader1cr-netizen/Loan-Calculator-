<!DOCTYPE html>
<html lang="hi" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VyajCalc | Smart Loan & Extra Interest Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="h-full font-sans text-slate-800 bg-slate-50 antialiased flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-xs">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-900 leading-tight">VyajCalc</h1>
                    <p class="text-[11px] text-slate-500 font-medium">Smart Loan & Extra Interest Calculator</p>
                </div>
            </div>
            <div class="bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-full text-xs font-semibold text-emerald-700 flex items-center space-x-1">
                <span>🇮🇳 INR (₹)</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-xl mx-auto px-4 py-5 w-full flex-grow">
        
        <!-- Tabs -->
        <div class="grid grid-cols-2 gap-2 bg-slate-200/80 p-1.5 rounded-2xl mb-5 shadow-inner">
            <button onclick="switchTab('reverse')" id="tab-reverse" class="py-2.5 px-3 text-xs font-bold rounded-xl transition-all bg-white text-indigo-600 shadow-sm flex flex-col items-center justify-center">
                <span>X Liya - Y Diya Calc</span>
            </button>
            <button onclick="switchTab('standard')" id="tab-standard" class="py-2.5 px-3 text-xs font-bold rounded-xl transition-all text-slate-600 flex flex-col items-center justify-center">
                <span>Standard EMI Calc</span>
            </button>
        </div>

        <!-- TAB 1: REVERSE CALCULATOR (X Liya - Y Diya) -->
        <section id="section-reverse" class="bg-white rounded-3xl shadow-xs border border-slate-200/80 p-5 mb-5">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h2 class="text-sm font-bold text-slate-900">Kitna Paisa Zyada Gaya Check Karein</h2>
                    <p class="text-[11px] text-slate-500">Loan amount aur wapas kiye gaye amount se byaj nikalein</p>
                </div>
                <button onclick="resetReverse()" class="text-xs text-indigo-600 font-semibold hover:underline flex items-center gap-1">Reset</button>
            </div>

            <!-- Presets -->
            <div class="mb-5">
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">Quick Presets (Ek Click Mein Try Karein)</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="setReversePreset(13199, 15407, 7, 'months')" class="p-2.5 bg-slate-50 border border-slate-200/80 rounded-xl hover:bg-indigo-50/30 hover:border-indigo-200 text-left transition-all">
                        <span class="block text-[11px] font-bold text-slate-700">📱 Mobile Loan</span>
                        <span class="text-[11px] text-indigo-600 font-semibold">₹13,199 @ 7M</span>
                    </button>
                    <button onclick="setReversePreset(100000, 115000, 1, 'years')" class="p-2.5 bg-slate-50 border border-slate-200/80 rounded-xl hover:bg-indigo-50/30 hover:border-indigo-200 text-left transition-all">
                        <span class="block text-[11px] font-bold text-slate-700">💸 Cash Loan</span>
                        <span class="text-[11px] text-indigo-600 font-semibold">₹1L ➔ ₹1.15L (1 Yr)</span>
                    </button>
                    <button onclick="setReversePreset(50000, 59000, 6, 'months')" class="p-2.5 bg-slate-50 border border-slate-200/80 rounded-xl hover:bg-indigo-50/30 hover:border-indigo-200 text-left transition-all col-span-2">
                        <span class="block text-[11px] font-bold text-slate-700">🏍️ Bike Loan</span>
                        <span class="text-[11px] text-indigo-600 font-semibold">₹50K ➔ ₹59K (6 Months)</span>
                    </button>
                </div>
            </div>

            <div class="space-y-4">
                <!-- Principal -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1.5">Kitna Loan Liya (Principal Amount):</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-3.5 text-slate-400 font-bold">₹</span>
                        <input type="number" id="rev-principal" value="13199" oninput="calculateReverse()" class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white">
                    </div>
                </div>

                <!-- Repayment Type Toggle & Input -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="text-xs font-semibold text-slate-700">Wapas Kaise Dena Hai:</label>
                        <div class="flex items-center space-x-3 text-xs">
                            <label class="flex items-center space-x-1 cursor-pointer font-medium text-slate-600">
                                <input type="radio" name="repayMode" value="total" checked onchange="toggleRepayMode()" class="text-indigo-600">
                                <span>Total Dena Hai</span>
                            </label>
                            <label class="flex items-center space-x-1 cursor-pointer font-medium text-slate-600">
                                <input type="radio" name="repayMode" value="emi" onchange="toggleRepayMode()" class="text-indigo-600">
                                <span>Monthly EMI</span>
                            </label>
                        </div>
                    </div>
                    <div class="relative flex items-center">
                        <span class="absolute left-3.5 text-slate-400 font-bold">₹</span>
                        <input type="number" id="rev-repay-amount" value="15407" oninput="calculateReverse()" class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white">
                    </div>
                    <p id="repay-hint" class="text-[10px] text-slate-400 mt-1">Poore samay mein kul milakar kitna wapas dena hai</p>
                </div>

                <!-- Tenure -->
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-2">
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Kitne Samay Ke Liye (Tenure):</label>
                        <input type="number" id="rev-tenure" value="7" oninput="calculateReverse()" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-7
